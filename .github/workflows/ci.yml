name: Banking Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: banking_test
          POSTGRES_PASSWORD: ci_test_only_password
          POSTGRES_DB: banking_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U banking_test -d banking_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7.4-bookworm
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      mailpit:
        image: axllent/mailpit:v1.27.4
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NODE_ENV: test
      PORT: 5001

      DATABASE_URL: postgresql://banking_test:ci_test_only_password@127.0.0.1:5434/banking_test?schema=public
      REDIS_URL: redis://127.0.0.1:6380/1

      TEST_DATABASE_NAME: banking_test
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_REDIS_HOST: 127.0.0.1

      PRODUCTION_DATABASE_HOST: production-database.invalid
      PRODUCTION_REDIS_HOST: production-redis.invalid

      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production-2026-11
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production-2026-11

      DEFAULT_ADMIN_EMAIL: ci-admin@example.test
      DEFAULT_ADMIN_PASSWORD: CI_only_test_admin_password_2026!

      CORS_ORIGINS: http://localhost:5173

      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_USER: ci-test
      SMTP_PASSWORD: ci-only-not-real
      EMAIL_FROM: no-reply@example.test
      EMAIL_FROM_NAME: Banking Platform CI Tests

      BODY_SIZE_LIMIT: 1mb
      SLOW_QUERY_THRESHOLD_MS: 250
      DATABASE_POOL_MAX: 3
      DATABASE_TX_MAX_WAIT_MS: 5000
      DATABASE_TX_TIMEOUT_MS: 10000

      GENERAL_RATE_LIMIT_WINDOW_MS: 900000
      GENERAL_RATE_LIMIT_MAX: 500
      AUTH_RATE_LIMIT_WINDOW_MS: 900000
      AUTH_RATE_LIMIT_MAX: 100
      OTP_RATE_LIMIT_WINDOW_MS: 600000
      OTP_RATE_LIMIT_MAX: 50
      TRANSFER_RATE_LIMIT_WINDOW_MS: 900000
      TRANSFER_RATE_LIMIT_MAX: 100
      TRANSACTION_HISTORY_RATE_LIMIT_WINDOW_MS: 900000
      TRANSACTION_HISTORY_RATE_LIMIT_MAX: 200

      OUTBOX_POLL_INTERVAL_MS: 1000
      OUTBOX_BATCH_SIZE: 20
      RISK_ANALYSIS_WINDOW_MINUTES: 60
      RISK_ANALYSIS_MAX_TRANSFERS_PER_WINDOW: 10
      DAILY_REPORT_CRON: "0 1 * * *"

      TRANSACTION_LIMIT_TIME_ZONE: Asia/Dhaka
      DAILY_WITHDRAWAL_LIMIT: "100000.00"
      DAILY_TRANSFER_LIMIT: "100000.00"
      TRANSFER_MAX_AMOUNT: "50000.00"
      TRANSFER_MIN_AMOUNT: "1.00"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create isolated test environment
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=5001

          DATABASE_URL=postgresql://banking_test:ci_test_only_password@127.0.0.1:5434/banking_test?schema=public
          REDIS_URL=redis://127.0.0.1:6380/1

          TEST_DATABASE_NAME=banking_test
          TEST_DATABASE_HOST=127.0.0.1
          TEST_REDIS_HOST=127.0.0.1

          PRODUCTION_DATABASE_HOST=production-database.invalid
          PRODUCTION_REDIS_HOST=production-redis.invalid

          JWT_ACCESS_SECRET=ci-test-access-secret-not-for-production-2026-11
          JWT_REFRESH_SECRET=ci-test-refresh-secret-not-for-production-2026-11

          DEFAULT_ADMIN_EMAIL=ci-admin@example.test
          DEFAULT_ADMIN_PASSWORD=CI_only_test_admin_password_2026!

          CORS_ORIGINS=http://localhost:5173

          SMTP_HOST=127.0.0.1
          SMTP_PORT=1025
          SMTP_USER=ci-test
          SMTP_PASSWORD=ci-only-not-real
          EMAIL_FROM=no-reply@example.test
          EMAIL_FROM_NAME=Banking Platform CI Tests

          BODY_SIZE_LIMIT=1mb
          SLOW_QUERY_THRESHOLD_MS=250
          DATABASE_POOL_MAX=3
          DATABASE_TX_MAX_WAIT_MS=5000
          DATABASE_TX_TIMEOUT_MS=10000

          GENERAL_RATE_LIMIT_WINDOW_MS=900000
          GENERAL_RATE_LIMIT_MAX=500
          AUTH_RATE_LIMIT_WINDOW_MS=900000
          AUTH_RATE_LIMIT_MAX=100
          OTP_RATE_LIMIT_WINDOW_MS=600000
          OTP_RATE_LIMIT_MAX=50
          TRANSFER_RATE_LIMIT_WINDOW_MS=900000
          TRANSFER_RATE_LIMIT_MAX=100
          TRANSACTION_HISTORY_RATE_LIMIT_WINDOW_MS=900000
          TRANSACTION_HISTORY_RATE_LIMIT_MAX=200

          OUTBOX_POLL_INTERVAL_MS=1000
          OUTBOX_BATCH_SIZE=20
          RISK_ANALYSIS_WINDOW_MINUTES=60
          RISK_ANALYSIS_MAX_TRANSFERS_PER_WINDOW=10
          DAILY_REPORT_CRON=0 1 * * *

          TRANSACTION_LIMIT_TIME_ZONE=Asia/Dhaka
          DAILY_WITHDRAWAL_LIMIT=100000.00
          DAILY_TRANSFER_LIMIT=100000.00
          TRANSFER_MAX_AMOUNT=50000.00
          TRANSFER_MIN_AMOUNT=1.00
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Apply isolated test database migrations
        run: npm run test:prepare

      - name: Run Vitest suite
        run: npm run test:run

      - name: Build application
        run: npm run build

